# ====================== BOT SETTINGS ======================
mode: testnet          # paper | testnet | live
exchange: binanceusdm

# Top N coins to scan
top_n: 50
scan_interval_seconds: 120
timeframes: ["15m", "1h", "4h"]

# ====================== STRATEGIES ======================
# Bật TẤT CẢ chiến thuật (để trống [] hoặc null = all)
enabled_strategies:
  - ORB
  - LiquiditySweep
  - OrderBlock
  - SupplyDemand
  - FVG
  - BOS_CHOCH
  - OI_Funding

# Params riêng từng strategy (optional)
strategy_params:
  ORB:
    range_bars: 4
    rr: 2.0
  LiquiditySweep:
    lookback: 30
    rr: 2.0
  OrderBlock:
    impulse_mult: 2.2
    rr: 2.5
  SupplyDemand:
    rr: 2.0
  FVG:
    min_gap_pct: 0.0015
    rr: 2.2
  BOS_CHOCH:
    swing_lookback: 5
    rr: 2.3
    use_choch: true
    use_bos: true
  OI_Funding:
    funding_extreme: 0.0008
    min_oi_change: 0.03
    rr: 2.0

# Capital & Risk (override by risk.yaml)
initial_capital: 1000
quote_asset: USDT

# Logging
log_level: INFO
log_file: logs/bot.log

# Dashboard
dashboard_port: 8501

# Multi-agent
use_redis: false
redis_url: redis://localhost:6379/0

# ML
ml_enabled: true
ml_model_path: data/models/signal_filter.joblib
ml_retrain_days: 7

# Backtest defaults
backtest:
  start: "2023-01-01"
  end: "2025-12-31"
  initial_capital: 10000
  commission: 0.0004
  slippage: 0.0002
  leverage: 5
