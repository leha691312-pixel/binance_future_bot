# ====================== RISK GATE ======================
max_position_pct: 0.05
max_total_exposure_pct: 0.30
max_open_positions: 15
min_risk_reward: 1.5
max_daily_loss_pct: 0.03
max_drawdown_pct: 0.12
cooldown_seconds: 45

default_leverage: 5
max_leverage: 10

risk_per_trade_pct: 0.01
atr_multiplier_sl: 1.5

kill_on_consecutive_losses: 6
kill_on_api_error_rate: 0.15
kill_on_high_volatility_atr: 4.0

duplicate_window_seconds: 300

max_positions_per_style:
  scalp: 5
  day: 5
  swing: 5

# ---- Invalidation / reverse (ĐÃ NỚI LỎNG) ----
# lookback lớn hơn → chỉ coi là đảo khi phá swing rõ hơn
invalidation_lookback_candles: 20
# chỉ đóng sớm khi RR còn lại rất thấp
min_remaining_rr: 0.15
# cho phép đi ngược entry xa hơn trước khi coi là adverse
max_adverse_pct: 3.5
# buffer phá BOS lớn hơn (0.4% thay vì 0.15%)
bos_buffer_pct: 0.40
# fallback max hold (dùng khi không có hold_profiles)
max_hold_minutes: 480

hold_profiles:
  scalp:
    max_hold_minutes: 90
  day:
    max_hold_minutes: 720
  swing:
    max_hold_minutes: 4320

strategy_trade_style:
  # Scalp
  ORB: scalp
  LiquiditySweep: scalp
  MARibbon: scalp
  StochBB: scalp
  PivotScalp: scalp
  EMARSIScalp: scalp
  # Day
  OrderBlock: day
  SupplyDemand: day
  FVG: day
  BOS_CHOCH: day
  TrendMA: day
  MomentumRSI: day
  PullbackEMA: day
  RangeBounce: day
  # Swing
  OI_Funding: swing
  SwingMACross: swing
  SwingRSI: swing
  FibPullback: swing
  BBSqueeze: swing

force_paper_on_startup: true
require_manual_confirm_live: true
