# ====================== RISK GATE (BẮT BUỘC) ======================
max_position_pct: 0.05          # 5% equity tối đa mỗi position
max_total_exposure_pct: 0.30    # 30% equity tổng
max_open_positions: 5
min_risk_reward: 1.8
max_daily_loss_pct: 0.03        # 3% daily loss → kill switch
max_drawdown_pct: 0.12          # 12% max DD → kill switch
cooldown_seconds: 45            # chống spam lệnh cùng symbol

# Leverage
default_leverage: 5             # leverage mặc định (hợp lý)
max_leverage: 10                # trần leverage (bot không vượt quá)

# Position sizing
risk_per_trade_pct: 0.01        # risk 1% equity mỗi trade
atr_multiplier_sl: 1.5

# Kill Switch conditions
kill_on_consecutive_losses: 6
kill_on_api_error_rate: 0.15
kill_on_high_volatility_atr: 4.0  # ATR% > 4%

# Anti-duplicate
duplicate_window_seconds: 300

# ====================== INVALIDATION / ĐẢO CHIỀU ======================
invalidation_lookback_candles: 12   # số nến 15m để tìm swing high/low
min_remaining_rr: 0.4               # nếu RR còn lại < 0.4 → đóng
max_adverse_pct: 1.5                # đi ngược entry > 1.5% → đóng
bos_buffer_pct: 0.15                # buffer % khi check Break of Structure

# Fallback nếu không classify được style
max_hold_minutes: 360

# Thời gian giữ tối đa theo kiểu giao dịch (phút)
hold_profiles:
  scalp:
    max_hold_minutes: 45          # ~45 phút
  day:
    max_hold_minutes: 360         # 6 giờ (trong phiên)
  swing:
    max_hold_minutes: 2880        # 48 giờ (2 ngày)

# Map strategy → trade style (ưu tiên cao hơn timeframe)
# Tên strategy phải khớp với field strategy trong Signal (chữ thường khi so sánh)
strategy_trade_style:
  orb: scalp
  liquidity_sweep: scalp
  bos_choch: day
  fvg: day
  order_block: day
  supply_demand: day
  oi_funding: swing

# Paper / Testnet safety
force_paper_on_startup: true
require_manual_confirm_live: true
