# ====================== RISK GATE (BẮT BUỘC) ======================
max_position_pct: 0.05
max_total_exposure_pct: 0.30
max_open_positions: 5
min_risk_reward: 1.8
max_daily_loss_pct: 0.03
max_drawdown_pct: 0.12
cooldown_seconds: 45

default_leverage: 5
max_leverage: 10

risk_per_trade_pct: 0.01
atr_multiplier_sl: 1.5

kill_on_consecutive_losses: 6
kill_on_api_error_rate: 0.15
kill_on_high_volatility_atr: 4.0

duplicate_window_seconds: 300

# ====================== INVALIDATION ======================
invalidation_lookback_candles: 12
min_remaining_rr: 0.4
max_adverse_pct: 1.5
bos_buffer_pct: 0.15
max_hold_minutes: 360

hold_profiles:
  scalp:
    max_hold_minutes: 45
  day:
    max_hold_minutes: 360
  swing:
    max_hold_minutes: 2880

strategy_trade_style:
  ORB: scalp
  LiquiditySweep: scalp
  OrderBlock: day
  SupplyDemand: day
  FVG: day
  BOS_CHOCH: day
  OI_Funding: swing
  TrendMA: day
  MomentumRSI: day
  PullbackEMA: day
  RangeBounce: day

force_paper_on_startup: true
require_manual_confirm_live: true
